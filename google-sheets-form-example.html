<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonix Google Sheets Form Integration</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: #0b0f0e;
            color: #768b7c;
        }
        
        .form-container {
            background: #111f1a;
            border: 1px solid #2f4e46;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #d7b76d;
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #768b7c;
            font-weight: 500;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #2f4e46;
            border-radius: 6px;
            background-color: #0b0f0e;
            color: #768b7c;
            font-size: 1rem;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #d7b76d;
            box-shadow: 0 0 0 2px rgba(215, 183, 109, 0.2);
        }
        
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .submit-btn {
            background: #d7b76d;
            color: #0b0f0e;
            border: none;
            padding: 1rem 2rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
        }
        
        .submit-btn:hover {
            background: #c9a55a;
            transform: translateY(-1px);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading-spinner {
            display: none;
            margin-left: 0.5rem;
        }
        
        .message {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 6px;
            font-weight: 500;
        }
        
        .success {
            background-color: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }
        
        .error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>🚀 Harmonix Contact Form</h1>
        <form id="google-sheets-form" data-handler="google-sheets">
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="company">Company</label>
                <input type="text" id="company" name="company">
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone">
            </div>
            
            <div class="form-group">
                <label for="interest">Area of Interest</label>
                <select id="interest" name="interest">
                    <option value="">Select an option</option>
                    <option value="ai_agents">AI Agents</option>
                    <option value="web_design">Web Design</option>
                    <option value="blockchain">Blockchain & Fintech</option>
                    <option value="launchpad">The Launchpad</option>
                    <option value="boardroom">The Boardroom</option>
                    <option value="other">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="budget">Budget Range</label>
                <select id="budget" name="budget">
                    <option value="">Select a range</option>
                    <option value="under_5k">Under $5,000</option>
                    <option value="5k_15k">$5,000 - $15,000</option>
                    <option value="15k_50k">$15,000 - $50,000</option>
                    <option value="over_50k">Over $50,000</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Tell us about your project or needs..."></textarea>
            </div>
            
            <input type="hidden" name="source" value="google-sheets-demo">
            <input type="hidden" name="sheetName" value="Harmonix Leads">
            
            <button type="submit" class="submit-btn">
                Submit Form
                <span class="loading-spinner">⟳</span>
            </button>
        </form>
        
        <div id="form-message"></div>
    </div>

    <!-- Include the form handler -->
    <script src="form-handler.js"></script>
    
    <!-- Additional form handling for this specific form -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('google-sheets-form');
            const messageDiv = document.getElementById('form-message');
            
            // Enhanced form submission handler
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                // Clear previous messages
                messageDiv.innerHTML = '';
                
                // Get form data
                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());
                
                // Show loading state
                const submitBtn = form.querySelector('.submit-btn');
                const spinner = form.querySelector('.loading-spinner');
                
                submitBtn.disabled = true;
                spinner.style.display = 'inline-block';
                submitBtn.textContent = 'Submitting...';
                
                try {
                    // Submit to your server endpoint
                    const response = await fetch('/submit', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(data)
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        // Show success message
                        messageDiv.innerHTML = `
                            <div class="message success">
                                ✅ Form submitted successfully! Your information has been saved to Google Sheets.
                                <br><small>Range: ${result.data.range || 'N/A'}</small>
                            </div>
                        `;
                        
                        // Reset form
                        form.reset();
                        
                        // Track success event
                        console.log('Form submitted successfully:', result);
                        
                    } else {
                        throw new Error(result.error || 'Submission failed');
                    }
                    
                } catch (error) {
                    console.error('Form submission error:', error);
                    
                    messageDiv.innerHTML = `
                        <div class="message error">
                            ❌ Error: ${error.message}
                            <br><small>Please check your Google Sheets configuration.</small>
                        </div>
                    `;
                }
                
                // Reset button state
                submitBtn.disabled = false;
                spinner.style.display = 'none';
                submitBtn.textContent = 'Submit Form';
            });
        });
    </script>
</body>
</html>
