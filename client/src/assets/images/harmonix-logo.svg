<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle -->
  <circle cx="50" cy="50" r="46" stroke="#D4AF37" stroke-width="6" fill="none"/>
  
  <!-- Inner H structure - based on your logo design -->
  <g fill="#D4AF37">
    <!-- Left vertical bar -->
    <rect x="30" y="25" width="6" height="50"/>
    
    <!-- Horizontal crossbar -->
    <rect x="36" y="47" width="28" height="6"/>
    
    <!-- Right vertical elements forming the H -->
    <rect x="64" y="25" width="6" height="22"/>
    <rect x="64" y="53" width="6" height="22"/>
    
    <!-- Small geometric accent - golden ratio inspired -->
    <rect x="54" y="35" width="4" height="8" opacity="0.8"/>
  </g>
</svg>