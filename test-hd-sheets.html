<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HD Google Sheets Test Form</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: #0b0f0e;
            color: #768b7c;
        }
        
        .form-container {
            background: #111f1a;
            border: 1px solid #2f4e46;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #d7b76d;
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #768b7c;
            font-weight: 500;
        }
        
        input, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #2f4e46;
            border-radius: 6px;
            background-color: #0b0f0e;
            color: #768b7c;
            font-size: 1rem;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #d7b76d;
            box-shadow: 0 0 0 2px rgba(215, 183, 109, 0.2);
        }
        
        .submit-btn {
            background: #d7b76d;
            color: #0b0f0e;
            border: none;
            padding: 1rem 2rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
        }
        
        .submit-btn:hover {
            background: #c9a55a;
            transform: translateY(-1px);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .message {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 6px;
            font-weight: 500;
        }
        
        .success {
            background-color: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }
        
        .error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
        
        .test-btn {
            background: #2f4e46;
            color: #d7b76d;
            border: 1px solid #d7b76d;
            margin-bottom: 1rem;
        }
        
        .test-btn:hover {
            background: #d7b76d;
            color: #0b0f0e;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>🚀 HD Google Sheets Test</h1>
        
        <!-- Test Connection Button -->
        <button id="test-connection" class="submit-btn test-btn">
            Test Google Sheets Connection
        </button>
        
        <!-- Form for submitting data -->
        <form id="hd-sheets-form">
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="company">Company</label>
                <input type="text" id="company" name="company">
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone">
            </div>
            
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Test message for HD Google Sheets integration..."></textarea>
            </div>
            
            <input type="hidden" name="source" value="hd-sheets-test">
            <input type="hidden" name="sheetName" value="HD Test Submissions">
            
            <button type="submit" class="submit-btn">
                Submit to HD Google Sheets
            </button>
        </form>
        
        <div id="form-message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('hd-sheets-form');
            const messageDiv = document.getElementById('form-message');
            const testBtn = document.getElementById('test-connection');
            
            // Test connection function
            testBtn.addEventListener('click', async function() {
                testBtn.disabled = true;
                testBtn.textContent = 'Testing...';
                messageDiv.innerHTML = '';
                
                try {
                    const response = await fetch('/test-sheets');
                    const result = await response.json();
                    
                    if (result.success) {
                        messageDiv.innerHTML = `
                            <div class="message success">
                                ✅ Connection successful!
                                <br><strong>Spreadsheet:</strong> ${result.spreadsheet.title}
                                <br><strong>Sheets:</strong> ${result.spreadsheet.sheets.join(', ')}
                            </div>
                        `;
                    } else {
                        throw new Error(result.error || 'Connection failed');
                    }
                } catch (error) {
                    messageDiv.innerHTML = `
                        <div class="message error">
                            ❌ Connection failed: ${error.message}
                            <br><small>Check HD_GOOGLE_SHEET_ID and HD_GOOGLE_SHEETS_CREDENTIALS</small>
                        </div>
                    `;
                }
                
                testBtn.disabled = false;
                testBtn.textContent = 'Test Google Sheets Connection';
            });
            
            // Form submission handler
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                messageDiv.innerHTML = '';
                
                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());
                
                const submitBtn = form.querySelector('.submit-btn[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Submitting...';
                
                try {
                    const response = await fetch('/submit', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(data)
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        messageDiv.innerHTML = `
                            <div class="message success">
                                ✅ Form submitted successfully to HD Google Sheets!
                                <br><strong>Range:</strong> ${result.data.range || 'N/A'}
                                <br><strong>Rows added:</strong> ${result.data.rowCount || 1}
                            </div>
                        `;
                        form.reset();
                    } else {
                        throw new Error(result.error || 'Submission failed');
                    }
                    
                } catch (error) {
                    messageDiv.innerHTML = `
                        <div class="message error">
                            ❌ Error: ${error.message}
                            <br><small>Check console for details</small>
                        </div>
                    `;
                    console.error('Submission error:', error);
                }
                
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit to HD Google Sheets';
            });
        });
    </script>
</body>
</html>
